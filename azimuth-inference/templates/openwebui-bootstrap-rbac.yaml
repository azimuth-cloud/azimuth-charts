apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui-bootstrap-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openwebui-bootstrap-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["openwebui-openai-key"]
  verbs: ["get", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openwebui-bootstrap-binding
subjects:
- kind: ServiceAccount
  name: openwebui-bootstrap-sa
roleRef:
  kind: Role
  name: openwebui-bootstrap-role
  apiGroup: rbac.authorization.k8s.io
