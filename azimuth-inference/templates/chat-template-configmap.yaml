apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "azimuth-inference.fullname" . }}-chat-template
  labels:
    {{- include "azimuth-inference.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/*.jinja" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
