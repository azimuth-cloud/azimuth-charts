apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-secret-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: secret-cleanup
    spec:
      serviceAccountName: openwebui-bootstrap-sa
      restartPolicy: OnFailure
      containers:
      - name: secret-cleanup
        image: alpine/k8s:1.35.6
        command:
          - /bin/sh
          - -c
          - |
            kubectl delete secret openwebui-openai-key -n {{ .Release.Namespace}} --ignore-not-found=true
