{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "azimuth-inference.fullname" . }}
  labels:
    {{- include "azimuth-inference.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "azimuth-inference.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: api
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      authorization:
        credentials:
          name: "llama-api-key"
          key: BACKEND_API_KEY
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_service_label_azimuth_stackhpc_com_inference_model
          targetLabel: model
{{- end }}
